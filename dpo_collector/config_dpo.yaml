# ============================================================
# dpo_collector — 전용 설정
# ============================================================
# 코어 config/config.yaml 은 수정하지 않고, 이 기능에 필요한 값만 여기서 관리한다.
# UI 설정 탭에서 이 파일을 읽고/쓰고/리로드한다 (해당 탭은 이후 단계에서 구현).
#
# ⚠ 현재 구현 범위: backends/ (모델 로드·추론), kg_bridge.py (KG 구축·샘플링),
#   store.py (페어 저장·export), state.py (어댑터/카운터/학습 이력).
#   answer_gen / metrics / train 섹션은 각 단계 구현 시 추가한다.

paths:
  data_ko_root: "data_ko"                # 파싱 결과가 있는 폴더 (저장소 기준 상대경로 또는 절대경로)
                                        #   구조: data_ko/<논문명>/parsing_paddle.json + images/
  kg_json:      "outputs/kg_ko.json"
  pairs_jsonl:  "outputs/dpo_pairs.jsonl"   # 학습용 (전체 메타, append-only)
  export_dir:   "outputs/export"            # 공유용 (타 기관 제공)
  adapter_dir:  "outputs/adapters"
  state_json:   "outputs/state.json"
  history_json: "outputs/training_history.json"
  # ── 고정 평가셋 (eval_ko.py) ──
  splits_json:       "outputs/splits.json"        # 논문 분할(동결)
  eval_jsonl:        "outputs/eval_ko.jsonl"      # 확정 평가셋
  eval_draft_jsonl:  "outputs/eval_ko_draft.jsonl" # 사람 검토 대기 후보
  lang_cache_json:   "outputs/paper_languages.json" # 논문 언어 판정 캐시

language: "ko"                          # 수집 언어 (ko | en | ...). 프롬프트/lang 필드가 참조

# ── 답변 생성 = 학습 대상 (Solver) ──────────────────────────────────────────
model:
  backend: "auto"                       # auto | hf | internvl
                                        #   auto = config.json architectures 로 자동 판별
                                        #   판별 불가 시 예외 → 여기에 명시할 것
  name: "OpenGVLab/InternVL3_5-4B-HF"   # HF 모델명 또는 로컬 경로. 자유 교체.
                                        #   · transformers 네이티브 리비전(-HF) → hf 백엔드
                                        #   · OpenGVLab/InternVL2_5-4B → internvl 백엔드(.chat())
                                        #   · Qwen/Qwen2.5-VL-7B-Instruct 등 → hf 백엔드
  dtype: "bfloat16"                     # ⚠ InternVL 계열은 4bit 금지(InternViT 출력 깨짐)
  device_map: "auto"                    # "auto" | "cuda:0" | null(수동 배치)
  use_flash_attn: false                 # flash-attn 미설치 시 자동으로 기본 attention 으로 폴백
  max_num_tiles: 12                     # dynamic tiling 상한. 고해상도 도표/차트 성능에 직접 영향
  input_size: 448                       # InternVL 타일 한 변 크기 (internvl 백엔드에서만 사용)
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  lora:                                 # 미지정(null)이면 backend.default_lora_targets() 사용
    target_modules: null                # 예: ["q_proj","k_proj","v_proj","o_proj"]

# ── 질문 생성 = Challenger (잘 되는 기존 모델 권장) ──────────────────────────
question_gen:
  backend: "auto"
  name: "OpenGVLab/InternVL3_5-4B-HF"   # 텍스트 전용 LLM(Qwen3-14B 등)으로 교체 가능
  dtype: "bfloat16"
  device_map: "auto"
  max_new_tokens: 256
  temperature: 0.8
  n_candidates: 3                       # 후보 질문 개수 (2~3)
  use_kg: true                          # KG 노드/엣지를 근거로 질문 생성
  prompt_template: null                 # null = 엣지 타입별 한국어 기본 템플릿 사용
                                        # 문자열을 넣으면 모든 엣지 타입에 이 템플릿을 적용.
                                        # 사용 가능 플레이스홀더:
                                        #   {language} {common_rules} {src_type} {dst_type}
                                        #   {src_content} {dst_content} {edge_type}
                                        #   {difficulty} {gold_answer} {image_hint} {kg_context}

# ── 답변 생성 (answer_sampler.py) — 생성기는 위 model(Solver)을 그대로 사용 ──
answer_gen:
  n_candidates: 3                       # 후보 답변 개수
  temperature: 0.9                      # 후보 다양성 확보 (부족하면 자동으로 온도를 올려 재시도)
  max_new_tokens: 512
  prompt_template: null                 # null = 기본 한국어 템플릿
                                        # 사용 가능 플레이스홀더: {language} {question}

# ── KG 구축 / 샘플링 (kg_bridge.py) ─────────────────────────────────────────
kg:
  max_papers: 0                         # 0 = 보유한 한국어 논문 전체
                                        #   data_ko 949편 중 본문이 한국어인 771편
                                        #   (나머지 177편은 영어, 1편은 본문 부족 — 자동 제외)
  language_filter: "ko"                 # 본문 언어가 이 값인 논문만 KG 에 넣는다.
                                        #   null 이면 필터 없음. 판정 결과는
                                        #   paths.lang_cache_json 에 캐시된다.
  augment_korean_refs: true             # "그림 1"/"표 2"/"식 (3)" 한국어 참조 엣지 보강
                                        #   코어 reference_graph.py 는 영문 패턴만 잡음
  overrides:                            # 코어 config.yaml::knowledge_graph 를 덮어쓴다
    reference:
      language: "ko"                    # 코어 ReferenceGraphBuilder 가 읽는 키.
                                        #   "ko" 면 "그림 1"/"표 2"/"식 (3)" 한국어 패턴을
                                        #   영어 패턴에 **추가로** 매칭한다.
    semantic:
      enabled: false                    # 켜려면 true. 코어가 embedding_model 을 지원하므로
                                        #   한국어 유사도도 신뢰할 수 있게 되었다.
                                        #   ⚠ 다만 전체 코퍼스는 99k 노드라 임베딩에
                                        #      상당한 시간/메모리가 든다 — 필요할 때 켤 것.
      embedding_model: "BAAI/bge-m3"    # 다국어 임베딩 (config_ko.yaml 과 동일)
      similarity_threshold: 0.75
    cross_document:
      enabled: false                    # SAME_CONCEPT(난이도 4 질문 근거). 위와 같은 이유로
                                        #   기본 off — 켜면 논문 간 코어퍼런스 엣지가 생긴다.
      coreference_threshold: 0.85
    vlm_enrichment:
      enabled: false                    #   GPU 추론 비용 — 필요 시 UI 에서 토글
  sampling:
    max_hops: 2                         # 경로 최대 홉 (1~3 권장)
    prefer_visual: true                 # Figure/Table 을 시작 노드로 가중 선택
    require_image: true                 # 멀티모달 DPO 수집 → 이미지 없는 경로는 제외

# ── 고정 평가셋 (eval_ko.py) ────────────────────────────────────────────────
# ⚠ 평가셋은 한 번 만들면 동결한다 (§1-4). 수집 풀과 논문 단위로 분리되며,
#   분할 결과는 splits.json 에 저장되어 이후 논문이 추가돼도 바뀌지 않는다.
eval:
  n_held_out_papers: 40                 # 평가 전용으로 떼어낼 논문 수 (수집에 절대 미사용)
  target_size: 120                      # draft 문항 수. 사람이 검토해 50~100편만 확정 권장
  require_image: true                   # 멀티모달 평가 → 이미지 있는 문항만
  require_hangul_gold: true             # 정답에 한글이 있어야 채택.
                                        #   한국어 논문이라도 도표 캡션이 영어만인 경우가 많은데
                                        #   한국어 평가셋의 정답으로는 부적절하다.
  split_seed: 42                        # 분할 재현용 시드
  max_new_tokens: 48                    # 정답이 도표 캡션(짧은 명사구)이라 길게 받을 이유가 없다.
                                        #   길면 서술형 답이 나와 ANLS 가 0 으로 깔린다.
  temperature: 0.0                      # greedy — 체크포인트 간 비교에 노이즈 방지
  metrics: ["anls", "accuracy", "f1"]   # models.eval_metrics.compute_all_metrics 와 정합
                                        #   ANLS·Accuracy 는 한국어 정상 동작
                                        #   F1 은 어절 단위라 조사 차이만큼 보수적

# ── 학습 트리거 + DPO 학습 (trigger.py / dpo_train.py) ──────────────────────
train:
  # ── 트리거 정책 (§7) ──
  first_train_min_pairs: 150            # 첫 학습 임계치
  retrain_every_n_pairs: 100            # 이후 재학습 주기
  min_pairs_per_type: 10                # 유형별 최소 개수 (유형 편향 가드레일).
                                        #   0 이면 가드레일 해제.
  guarded_question_types: []            # 비우면 **실제 수집된 유형만** 검사한다.
                                        #   ["VQA","Reasoning"] 처럼 지정하면 그 유형을 강제.
                                        #   전체 유형을 요구하면 초기 학습이 막힐 수 있으니 주의.

  # ── DPO 하이퍼파라미터 (§8) ──
  dpo_beta: 0.1                         # loss = -log σ(β·(Δθ - Δref))
  learning_rate: 5.0e-6
  epochs: 2
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  log_every: 10                         # 로그/진행률 갱신 주기(step)

  # ── 메모리 (DPO 는 페어당 forward 4회 + policy 그래프 2개를 동시에 유지한다) ──
  gradient_checkpointing: true          # 활성화 메모리를 크게 줄인다 (속도는 ~30% 감소)
  max_num_tiles: 6                      # 학습 중 타일 수. 추론용 model.max_num_tiles(12)와 분리.
                                        #   ⚠ 실측: 이미지 2장×12타일에서 4페어 중 3건 OOM.
                                        #      6타일 + checkpointing 으로 해소.
  max_answer_tokens: 256                # 답변 길이 상한. chosen/rejected 에 동일 적용되므로
                                        #   선호 비교의 공정성은 유지된다.
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: null                # null 이면 backend.default_lora_targets()
                                        #   (Qwen/InternVL 계열 공통: q/k/v/o_proj, 비전 타워 freeze)

# ── 공유용 내보내기 (store.py) ──────────────────────────────────────────────
export:
  format: "rlaif_v"                     # rlaif_v | hf_conversational
                                        #   rlaif_v          : {image, question, chosen, rejected}
                                        #                      image 가 단일 필드라 다중 이미지는 첫 장만
                                        #   hf_conversational: {images, prompt, chosen, rejected}
                                        #                      다중 이미지 보존, TRL DPOTrainer 호환
  copy_images: true                     # 이미지를 export/images/ 로 복사하고 상대경로로 기록
  field_map:                            # 타 기관 스키마 대응 — 출력 키 이름만 바꾼다
    image:    "image"
    question: "question"
    chosen:   "chosen"
    rejected: "rejected"
